name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Trigger this manually (Actions tab -> this workflow -> Run workflow)
  # after editing content in Supabase, since content is fetched at build
  # time — a Supabase edit alone doesn't republish the static site.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.urls }}
      keyloc: ${{ steps.changes.outputs.keyloc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js needs Node's native WebSocket support
          # (stable from Node 22) to construct its client at all, even
          # though this template never uses realtime features — Node 20
          # throws at build time the first moment a real Supabase URL/key
          # is present (undici, a supabase-js dependency, also requires
          # >=22.19.0, per its own npm install warning).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Optional — falls back to a generic value in OptimizedImage.astro
          # if unset. Set once per Unsplash API application, reused across
          # every client site built from this template (see .env.example).
          PUBLIC_UNSPLASH_APP_NAME: ${{ secrets.PUBLIC_UNSPLASH_APP_NAME }}
          # IndexNow key (repository variable, not secret): served at
          # /indexnow-key.txt. Unset = IndexNow off.
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
      # Which pages changed versus the live site (sitemap <lastmod>), for
      # the IndexNow notice the deploy job sends.
      - id: changes
        if: ${{ vars.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow-changes.mjs > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell IndexNow search engines (Bing, Yandex, and others; Bing also
      # feeds Copilot and ChatGPT search) which pages just changed, so they
      # re-crawl them now instead of on their own schedule. Google doesn't
      # use IndexNow; it reads the sitemap's <lastmod> dates instead. A
      # failed notice never fails the deploy.
      - name: Notify IndexNow
        if: ${{ vars.INDEXNOW_KEY != '' && needs.build.outputs.changed != '' && needs.build.outputs.changed != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}
          URLS: ${{ needs.build.outputs.changed }}
          KEYLOC: ${{ needs.build.outputs.keyloc }}
        run: |
          HOST=$(echo "$KEYLOC" | awk -F/ '{print $3}')
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$KEYLOC" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}' > body.json
          echo "Sending $(jq '.urlList | length' body.json) changed pages to IndexNow"
          curl -sS -o /dev/null -w "IndexNow responded %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
